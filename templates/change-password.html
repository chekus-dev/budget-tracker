{{define "change-password.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Change Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#185fa5">
    <style>
        :root {
            --primary: #185fa5;
            --primary-dark: #0C447C;
            --bg-light: #f8f9fa;
            --surface-light: #ffffff;
            --text-primary: #1a1a1a;
            --text-secondary: #666;
            --border: #e0e0e0;
            --danger: #ef4444;
            --success: #10b981;
        }

        html.dark {
            --bg-light: #0f0f0f;
            --surface-light: #1a1a1a;
            --text-primary: #f5f5f5;
            --text-secondary: #999;
            --border: #333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-light);
            color: var(--text-primary);
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px 16px 120px;
        }

        .page-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .page-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        .form-section {
            background: var(--surface-light);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .form-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            background: var(--surface-light);
            color: var(--text-primary);
            margin-bottom: 12px;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(24, 95, 165, 0.1);
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        .form-error {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 13px;
            margin-bottom: 16px;
        }

        .form-success {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 13px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    {{template "nav.html" .}}

    <div class="container">
        <h1 class="page-title">Change Password</h1>
        <p class="page-subtitle">Update the password for your account</p>

        {{if .Error}}
        <div class="form-error">{{.Error}}</div>
        {{end}}
        {{if .Success}}
        <div class="form-success">{{.Success}}</div>
        {{end}}

        <div class="form-section">
            <form action="/account/change-password" method="POST">
                <label class="form-label" for="current_password">Current password</label>
                <input type="password" id="current_password" name="current_password" class="form-input" required autocomplete="current-password">

                <label class="form-label" for="new_password">New password</label>
                <input type="password" id="new_password" name="new_password" class="form-input" required minlength="6" autocomplete="new-password">

                <label class="form-label" for="confirm_password">Confirm new password</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-input" required minlength="6" autocomplete="new-password">

                <button type="submit" class="submit-btn">Update Password</button>
            </form>
        </div>
    </div>
</body>
</html>
{{end}}
