{{define "change-password.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Change password — Budget Tracker</title>
    {{template "head.html" .}}
</head>
<body class="has-chrome">
    {{template "nav.html" .}}

    <main class="app-main">
        <div class="page-head">
            <h1 class="page-title">Change password</h1>
            <p class="page-sub">Update the password for your account</p>
        </div>

        {{if .Error}}
        <div class="alert alert-over mb-4" role="alert">
            <svg class="icon" aria-hidden="true"><use href="/static/icons.svg#alert"/></svg>
            <p>{{.Error}}</p>
        </div>
        {{end}}

        {{if .Success}}
        <div class="alert alert-safe mb-4" role="status">
            <svg class="icon" aria-hidden="true"><use href="/static/icons.svg#check"/></svg>
            <p>{{.Success}}</p>
        </div>
        {{end}}

        <section class="card">
            <form action="/account/change-password" method="POST">
                <div class="auth-field">
                    <label class="label" for="current_password">Current password</label>
                    <input type="password" id="current_password" name="current_password" class="input"
                           required autocomplete="current-password">
                </div>

                <div class="auth-field">
                    <label class="label" for="new_password">New password</label>
                    <input type="password" id="new_password" name="new_password" class="input"
                           required minlength="8" autocomplete="new-password" aria-describedby="password-hint">
                    <p class="hint" id="password-hint">At least 8 characters.</p>
                </div>

                <div class="auth-field">
                    <label class="label" for="confirm_password">Confirm new password</label>
                    <input type="password" id="confirm_password" name="confirm_password" class="input"
                           required minlength="8" autocomplete="new-password">
                </div>

                <button type="submit" class="btn btn-primary btn-block">Update password</button>
            </form>
        </section>
    </main>
</body>
</html>
{{end}}
