{{define "archive.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archive</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #185fa5;
            --primary-dark: #0C447C;
            --bg-light: #f8f9fa;
            --surface-light: #ffffff;
            --text-primary: #1a1a1a;
            --text-secondary: #666;
            --border: #e0e0e0;
        }

        html.dark {
            --bg-light: #0f0f0f;
            --surface-light: #1a1a1a;
            --text-primary: #f5f5f5;
            --text-secondary: #999;
            --border: #333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-light);
            color: var(--text-primary);
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px 16px 120px;
        }

        .page-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .page-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        /* Month Card */
        .month-card {
            background: var(--surface-light);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            color: inherit;
        }

        .month-card:hover {
            border-color: var(--primary);
            box-shadow: 0 2px 8px rgba(24, 95, 165, 0.1);
        }

        .month-info {
            flex: 1;
        }

        .month-name {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .month-count {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .month-amount {
            font-size: 16px;
            font-weight: 700;
            color: var(--primary);
            text-align: right;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }

        .empty-icon {
            font-size: 40px;
            margin-bottom: 12px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    {{template "nav.html" .}}

    <div class="container">
        <h1 class="page-title">Archive</h1>
        <p class="page-subtitle">Browse all months with recorded expenses</p>

        {{if .Months}}
        <div>
            {{range .Months}}
            <a href="/archive?month={{.Month}}" class="month-card">
                <div class="month-info">
                    <div class="month-name">{{.Label}}</div>
                    <div class="month-count">{{.Count}} expense{{if ne .Count 1}}s{{end}}</div>
                </div>
                <div class="month-amount">₦{{printf "%.2f" .Total}}</div>
            </a>
            {{end}}
        </div>
        {{else}}
        <div class="empty-state">
            <div class="empty-icon">📭</div>
            <div>No archived expenses yet</div>
        </div>
        {{end}}
    </div>
</body>
</html>
{{end}}
