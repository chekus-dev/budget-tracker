{{define "head.html"}}
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">

<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#4F46E5" id="theme-color-meta">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Budget">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="icon" href="/static/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/static/css/app.css?v=3">

<script>
  (function () {
    var root = document.documentElement;
    var meta = document.getElementById('theme-color-meta');

    function osPrefersDark() {
      try {
        return window.matchMedia('(prefers-color-scheme: dark)').matches;
      } catch (e) {
        return false;
      }
    }

    function resolve(stored) {
      if (stored === 'dark') return 'dark';
      if (stored === 'light') return 'light';
      if (stored === 'system') return osPrefersDark() ? 'dark' : 'light';
      return 'light';
    }

    window.budgetTheme = {
      current: function () {
        var stored = null;
        try { stored = localStorage.getItem('bt-theme'); } catch (e) {}
        return resolve(stored);
      },
      set: function (theme) {
        theme = (theme === 'light' || theme === 'dark') ? theme : 'system';
        try { localStorage.setItem('bt-theme', theme); } catch (e) {}
        this.apply(resolve(theme));
      },
      apply: function (theme) {
        var dark = theme === 'dark';
        root.classList.toggle('dark', dark);
        root.classList.toggle('light', !dark);
        if (meta) meta.setAttribute('content', dark ? '#0B1220' : '#4F46E5');
      }
    };

    try {
      window.budgetTheme.apply(window.budgetTheme.current());
    } catch (e) {
      root.classList.add('light');
      root.classList.remove('dark');
    }
  })();
</script>
{{end}}
