{{define "forgot-password.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Forgot password — Budget Tracker</title>
    {{template "head.html" .}}
</head>
<body>
    <main class="auth-shell">
        <div class="auth-card">
            <div class="auth-brand">
                <span class="brand-mark" aria-hidden="true">₦</span>
                Budget Tracker
            </div>

            <h2 class="auth-title">Reset your password</h2>
            <p class="auth-sub">Enter the email on your account and we'll send you a 6-digit code.</p>

            {{if .Error}}
            <div class="alert alert-over mb-4" role="alert">
                <svg class="icon" aria-hidden="true"><use href="/static/icons.svg#alert"/></svg>
                <p>{{.Error}}</p>
            </div>
            {{end}}

            <form action="/forgot-password" method="POST">
                <div class="auth-field">
                    <label class="label" for="email">Email</label>
                    <input type="email" id="email" name="email" class="input"
                           required autofocus autocomplete="email"
                           value="{{.Email}}">
                </div>

                <button type="submit" class="btn btn-primary btn-block">Send code</button>
            </form>

            <p class="auth-foot"><a href="/login">Back to log in</a></p>
        </div>
    </main>
</body>
</html>
{{end}}
