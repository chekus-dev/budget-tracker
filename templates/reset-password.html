{{define "reset-password.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Set new password — Budget Tracker</title>
    {{template "head.html" .}}
<link rel="stylesheet" href="/static/css/auth-reset.css?v=2">
<script src="/static/password-toggle.js?v=2" defer></script>
</head>
<body>
    <main class="auth-shell">
        <div class="auth-card">
            <div class="auth-brand">
                <span class="brand-mark" aria-hidden="true">₦</span>
                Budget Tracker
            </div>

            <h1 class="auth-title">Set a new password</h1>
            <p class="auth-sub">Pick something you haven't used before.</p>

            {{if .Error}}
            <div class="alert alert-over mb-4" role="alert">
                <svg class="icon" aria-hidden="true"><use href="/static/icons.svg?v=7#alert"/></svg>
                <p>{{.Error}}</p>
            </div>
            {{end}}

            <form action="/reset-password" method="POST">
                <div class="auth-field">
                    <label class="label" for="new_password">New password</label>
                    <input type="password" id="new_password" name="new_password" class="input"
                           required minlength="8" maxlength="72"
                           autocomplete="new-password" autofocus>
                    <p class="hint">At least 8 characters.</p>
                </div>

                <div class="auth-field">
                    <label class="label" for="confirm_password">Confirm password</label>
                    <input type="password" id="confirm_password" name="confirm_password" class="input"
                           required minlength="8" maxlength="72"
                           autocomplete="new-password">
                </div>

                <button type="submit" class="btn btn-primary btn-block">Set new password</button>
            </form>

            <p class="auth-foot"><a href="/login">Back to log in</a></p>
        </div>
    </main>
</body>
</html>
{{end}}
