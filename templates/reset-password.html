{{define "reset-password.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Reset Password — Budget Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #185fa5; --primary-dark: #0C447C; --bg-light: #f8f9fa;
            --surface-light: #ffffff; --text-primary: #1a1a1a; --text-secondary: #666;
            --border: #e0e0e0; --danger: #ef4444; --success: #16a34a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-light); color: var(--text-primary); min-height: 100vh;
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .auth-card {
            width: 100%; max-width: 380px; background: var(--surface-light);
            border: 1px solid var(--border); border-radius: 16px; padding: 32px 28px;
        }
        .auth-title { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
        .auth-subtitle { font-size: 13px; color: var(--text-secondary); margin-bottom: 24px; }
        .form-label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
        .form-input {
            width: 100%; padding: 11px 12px; border: 1px solid var(--border); border-radius: 8px;
            font-size: 14px; font-family: inherit; background: var(--surface-light);
            color: var(--text-primary); margin-bottom: 16px;
        }
        .form-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(24, 95, 165, 0.1); }
        .submit-btn {
            width: 100%; padding: 12px; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white; border: none; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer;
        }
        .submit-btn:active { transform: scale(0.98); }
        .auth-error {
            background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 8px; padding: 10px 12px; font-size: 13px; margin-bottom: 16px;
        }
        .auth-footer { text-align: center; font-size: 13px; color: var(--text-secondary); margin-top: 20px; }
        .auth-footer a { color: var(--primary); font-weight: 600; text-decoration: none; }
    </style>
</head>
<body>
    <div class="auth-card">
        <h1 class="auth-title">Set a new password</h1>
        <p class="auth-subtitle">Choose a new password for your account.</p>

        {{if .Error}}<div class="auth-error">{{.Error}}</div>{{end}}

        {{if .Valid}}
        <form action="/reset-password" method="POST">
            <input type="hidden" name="token" value="{{.Token}}">
            <label class="form-label" for="new_password">New password</label>
            <input type="password" id="new_password" name="new_password" class="form-input" required minlength="6" autocomplete="new-password">
            <label class="form-label" for="confirm_password">Confirm password</label>
            <input type="password" id="confirm_password" name="confirm_password" class="form-input" required minlength="6" autocomplete="new-password">
            <button type="submit" class="submit-btn">Reset password</button>
        </form>
        {{else}}
        <p class="auth-footer"><a href="/forgot-password">Request a new reset link</a></p>
        {{end}}

        <p class="auth-footer"><a href="/login">Back to log in</a></p>
    </div>
</body>
</html>
{{end}}
