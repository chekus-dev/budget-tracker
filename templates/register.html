{{define "register.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Create Account — Budget Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#185fa5">
    <style>
        :root {
            --primary: #185fa5;
            --primary-dark: #0C447C;
            --bg-light: #f8f9fa;
            --surface-light: #ffffff;
            --text-primary: #1a1a1a;
            --text-secondary: #666;
            --border: #e0e0e0;
            --danger: #ef4444;
        }

        html.dark {
            --bg-light: #0f0f0f;
            --surface-light: #1a1a1a;
            --text-primary: #f5f5f5;
            --text-secondary: #999;
            --border: #333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-light);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 380px;
            background: var(--surface-light);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px 28px;
        }

        .auth-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
        }

        .auth-logo-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .auth-logo-text {
            font-weight: 600;
            font-size: 16px;
        }

        .auth-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .auth-subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            background: var(--surface-light);
            color: var(--text-primary);
            transition: border-color 0.2s;
            margin-bottom: 16px;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(24, 95, 165, 0.1);
        }

        .form-hint {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: -12px;
            margin-bottom: 16px;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(24, 95, 165, 0.3);
        }

        .submit-btn:active {
            transform: translateY(0) scale(0.98);
        }

        .auth-error {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 13px;
            margin-bottom: 16px;
        }

        .auth-footer {
            text-align: center;
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 20px;
        }

        .auth-footer a {
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="auth-logo">
            <div class="auth-logo-icon">₦</div>
            <span class="auth-logo-text">Budget Tracker</span>
        </div>
        <h1 class="auth-title">Create your account</h1>
        <p class="auth-subtitle">Start tracking your spending</p>

        {{if .Error}}
        <div class="auth-error">{{.Error}}</div>
        {{end}}

        <form action="/register" method="POST">
            <label class="form-label" for="username">Username</label>
            <input type="text" id="username" name="username" class="form-input" required autofocus autocomplete="username">

            <label class="form-label" for="email">Email</label>
            <input type="email" id="email" name="email" class="form-input" required autocomplete="email">
            <p class="form-hint">Used only for password recovery.</p>

            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" name="password" class="form-input" required autocomplete="new-password" minlength="6">
            <p class="form-hint">At least 6 characters.</p>

            <label class="form-label" for="confirm_password">Confirm password</label>
            <input type="password" id="confirm_password" name="confirm_password" class="form-input" required autocomplete="new-password" minlength="6">

            <button type="submit" class="submit-btn">Create Account</button>
        </form>

        <p class="auth-footer">Already have an account? <a href="/login">Log in</a></p>
    </div>
</body>
</html>
{{end}}
