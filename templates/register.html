{{define "register.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Budget Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #185fa5;
            --primary-dark: #0C447C;
            --bg-light: #f8f9fa;
            --surface-light: #ffffff;
            --text-primary: #1a1a1a;
            --text-secondary: #666;
            --border: #e0e0e0;
        }

        html.dark {
            --bg-light: #0f0f0f;
            --surface-light: #1a1a1a;
            --text-primary: #f5f5f5;
            --text-secondary: #999;
            --border: #333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-light);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 420px;
            animation: slideUp 0.4s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo {
            width: 56px;
            height: 56px;
            margin: 0 auto 16px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: white;
        }

        .auth-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .auth-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
        }

        /* Form */
        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            background: var(--surface-light);
            color: var(--text-primary);
            transition: all 0.2s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(24, 95, 165, 0.1);
        }

        .form-input::placeholder {
            color: var(--text-secondary);
        }

        /* Alert */
        .alert {
            padding: 12px 14px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 13px;
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
            display: none;
        }

        .alert.show {
            display: block;
        }

        /* Checkbox */
        .form-checkbox {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin: 16px 0;
            font-size: 13px;
        }

        .form-checkbox input {
            width: 18px;
            height: 18px;
            margin-top: 2px;
            cursor: pointer;
            accent-color: var(--primary);
        }

        .form-checkbox label {
            cursor: pointer;
            flex: 1;
        }

        .form-checkbox a {
            color: var(--primary);
            text-decoration: none;
        }

        .form-checkbox a:hover {
            text-decoration: underline;
        }

        /* Button */
        .submit-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 8px;
        }

        .submit-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(24, 95, 165, 0.3);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        /* Footer */
        .auth-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .auth-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        .auth-footer a:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-header">
            <div class="logo">₦</div>
            <h1 class="auth-title">Create account</h1>
            <p class="auth-subtitle">Join thousands managing their money</p>
        </div>

        {{if .Error}}
        <div class="alert show">{{.Error}}</div>
        {{end}}

        <form method="POST" action="/register">
            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input id="username" type="text" name="username" required autofocus placeholder="Choose a username" class="form-input">
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input id="password" type="password" name="password" required minlength="6" placeholder="At least 6 characters" class="form-input">
            </div>

            <div class="form-group">
                <label class="form-label" for="confirm">Confirm password</label>
                <input id="confirm" type="password" name="confirm_password" required minlength="6" placeholder="Repeat your password" class="form-input">
            </div>

            <div class="form-checkbox">
                <input type="checkbox" id="agree" name="agree" required>
                <label for="agree">
                    I agree to the terms of service and privacy policy
                </label>
            </div>

            <button type="submit" class="submit-btn">Create account</button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="/login">Sign in</a>
        </div>
    </div>

    <script>
        // Validate password match
        document.querySelector('form').addEventListener('submit', (e) => {
            const pwd = document.getElementById('password').value;
            const confirm = document.getElementById('confirm').value;
            if (pwd !== confirm) {
                e.preventDefault();
                alert('Passwords do not match');
                return false;
            }
        });
    </script>
</body>
</html>
{{end}}
