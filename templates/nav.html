{{define "nav.html"}}
<script>
    (function() {
        const theme = localStorage.getItem('bt-theme') || 'system';
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (theme === 'dark' || (theme === 'system' && prefersDark)) {
            document.documentElement.classList.add('dark');
        }
    })();
</script>
<style>
    :root {
        --primary-color: #185fa5;
        --primary-dark: #0C447C;
        --primary-light: #5eb3ff;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html {
        transition: background-color 0.3s, color 0.3s;
    }

    body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #f8f9fa;
        color: #1a1a1a;
    }

    body.dark {
        background: #0f0f0f;
        color: #f5f5f5;
    }

    .header {
        padding: 20px 16px 24px;
        background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
        color: white;
        position: sticky;
        top: 0;
        z-index: 20;
        margin-bottom: 0;
        border-radius: 0;
    }

    .header-content {
        max-width: 480px;
        margin: 0 auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .logo {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
        font-size: 16px;
    }

    .logo-icon {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
    }

    .header-actions {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .logout-btn {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: white;
        border-radius: 6px;
        padding: 6px 12px;
        font-size: 12px;
        cursor: pointer;
        transition: all 0.2s ease;
        font-family: inherit;
    }

    .logout-btn:hover {
        background: rgba(255, 255, 255, 0.2);
    }

    /* Bottom Navigation */
    .bottom-nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        max-width: 480px;
        margin: 0 auto;
        background: white;
        border-top: 1px solid #e0e0e0;
        display: flex;
        justify-content: space-around;
        z-index: 100;
    }

    body.dark .bottom-nav {
        background: #1a1a1a;
        border-color: #333;
    }

    .nav-item {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 12px 4px;
        gap: 6px;
        font-size: 10px;
        color: #666;
        text-decoration: none;
        cursor: pointer;
        transition: color 0.2s ease;
        border: none;
        background: none;
        font-family: inherit;
    }

    .logout-nav-form {
        flex: 1;
        display: flex;
    }

    .logout-nav-item {
        width: 100%;
        color: #b42318;
    }

    .logout-nav-item:hover {
        color: #dc2626;
    }

    body.dark .nav-item {
        color: #999;
    }

    .nav-item.active {
        color: var(--primary-color);
    }

    body.dark .nav-item.active {
        color: var(--primary-light);
    }

    .nav-icon {
        font-size: 18px;
    }

    .nav-label {
        font-weight: 500;
    }

    @media (min-width: 481px) {
        .header-content,
        .bottom-nav {
            max-width: 720px;
        }

        .header {
            padding-left: 24px;
            padding-right: 24px;
        }
    }

    @media (max-width: 380px) {
        .header {
            padding: 14px 12px 16px;
        }

        .header-content {
            gap: 8px;
        }

        .logo {
            font-size: 14px;
        }

        .header-actions {
            gap: 6px;
        }

        .logout-btn {
            padding: 6px 8px;
        }

        .nav-item {
            padding: 10px 2px;
            gap: 4px;
            font-size: 9px;
        }

        .nav-icon {
            font-size: 16px;
        }
    }
</style>

<header class="header">
    <div class="header-content">
        <div class="logo">
            <div class="logo-icon">₦</div>
            <span>Budget</span>
        </div>
    </div>
</header>

<nav class="bottom-nav" id="bottom-nav">
    <a href="/" class="nav-item" id="nav-home">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">Home</span>
    </a>
    <a href="/report" class="nav-item" id="nav-report">
        <span class="nav-icon">📊</span>
        <span class="nav-label">Report</span>
    </a>
    <a href="/archive" class="nav-item" id="nav-archive">
        <span class="nav-icon">📦</span>
        <span class="nav-label">Archive</span>
    </a>
    <a href="/settings" class="nav-item" id="nav-settings">
        <span class="nav-icon">⚙️</span>
        <span class="nav-label">Settings</span>
    </a>
    <a href="/settings/saved" class="nav-item" id="nav-saved">
        <span class="nav-icon">🗂️</span>
        <span class="nav-label">Saved</span>
    </a>
    {{if .Username}}
    <form action="/logout" method="POST" class="logout-nav-form">
        <button type="submit" class="nav-item logout-nav-item" title="Logout">
            <span class="nav-icon">🚪</span>
            <span class="nav-label">Logout</span>
        </button>
    </form>
    {{end}}
</nav>

<script>
    // Set active nav item based on current page
    function setActiveNav() {
        const path = window.location.pathname;
        document.querySelectorAll('.nav-item').forEach(item => {
            item.classList.remove('active');
        });

        if (path === '/') {
            document.getElementById('nav-home').classList.add('active');
        } else if (path === '/report') {
            document.getElementById('nav-report').classList.add('active');
        } else if (path === '/archive' || path.startsWith('/archive?')) {
            document.getElementById('nav-archive').classList.add('active');
        } else if (path === '/settings/saved') {
            document.getElementById('nav-saved').classList.add('active');
        } else if (path === '/settings') {
            document.getElementById('nav-settings').classList.add('active');
        }
    }

    setActiveNav();

    // Load theme preference
    if (localStorage.getItem('bt-theme') === 'dark') {
        document.documentElement.classList.add('dark');
        document.body.classList.add('dark');
    }
</script>
{{end}}
