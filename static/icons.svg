<?xml version="1.0" encoding="UTF-8"?>
<!--
  Budget Tracker icon sprite.

  Usage:
    <svg class="icon" aria-hidden="true"><use href="/static/icons.svg#home"/></svg>

  Every symbol is 24x24, stroke-only, and inherits `currentColor`, so icons
  follow the text colour and therefore theme with dark mode automatically —
  no per-theme icon files and no icon font.

  Decorative icons take aria-hidden="true". An icon that carries meaning on
  its own (an icon-only button) needs a visually-hidden text label instead.
-->
