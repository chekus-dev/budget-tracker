<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f9a75"/>
      <stop offset="1" stop-color="#095f49"/>
    </linearGradient>
    <pattern id="grain" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".55" fill="#fff" opacity=".12"/>
      <circle cx="5" cy="4" r=".45" fill="#001d16" opacity=".1"/>
    </pattern>
  </defs>
  <rect width="512" height="512" fill="url(#green)"/>
  <rect width="512" height="512" fill="url(#grain)"/>
  <text x="256" y="350" text-anchor="middle" fill="#fff"
        font-family="Arial, Helvetica, sans-serif" font-size="270"
        font-weight="700">₦</text>
</svg>
